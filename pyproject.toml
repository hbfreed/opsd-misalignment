[project]
name = "opsd-misalignment"
version = "0.1.0"
description = "Healing conditional misalignment with on-policy self-distillation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Tinker LoRA finetuning + sampling of open-weight models (Inkling-Small).
    # See https://tinker-docs.thinkingmachines.ai for access.
    "tinker>=0.27",
    "tinker-cookbook>=0.5.6",
    # Sampling + GPT-4o judge orchestration, as used by the paper repo.
    "llmcomp>=1.6",
    "slist>=0.3",
    "latteries>=0.1",
    # latteries imports tenacity but does not declare it.
    "tenacity>=8.2",
    # Analysis / plots.
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[tool.uv]
# GPUs live on a separate box; nothing here pins torch/CUDA on purpose.

[tool.ruff]
line-length = 100
